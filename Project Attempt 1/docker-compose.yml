version: "3.9"

services:
  semi-coint-ml-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semi-coint-ml-trader
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["--mode", "download", "--incremental"]

  dashboard-server:
    image: python:3.12-slim
    container_name: semi-coint-dashboard
    working_dir: /app/outputs/reports
    volumes:
      - ./outputs:/app/outputs:ro
    ports:
      - "8080:8080"
    command: ["python", "-m", "http.server", "8080"]

